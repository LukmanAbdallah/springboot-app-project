name: JHipster CI Build

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master


jobs:

  # ============================
  # Job 1: Build and Test
  # ============================
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # Legacy JHipster requires Java 8
      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'
          cache: 'maven'


      # Force Java 8 environment
      - name: Force Java 8
        run: |
          echo "JAVA_HOME=$JAVA_HOME_8_X64" >> $GITHUB_ENV
          echo "$JAVA_HOME_8_X64/bin" >> $GITHUB_PATH


      # Maven wrapper permission
      - name: Make Maven Wrapper Executable
        run: |
          chmod +x mvnw
          ls -l mvnw


      - name: Verify Java Version
        run: |
          java -version
          ./mvnw -version


      # Old JHipster frontend
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '6.11.0'


      - name: Install old frontend tools
        run: |
          npm install -g rimraf@2 webpack@2.5.0
          echo "$(npm bin -g)" >> $GITHUB_PATH



      # Build legacy application
      - name: Build with Maven
        env:
          KOTLIN_JVM_TARGET: "1.8"
          MAVEN_OPTS: "-Dkotlin.compiler.jvmTarget=1.8"
          NODE_TLS_REJECT_UNAUTHORIZED: "0"
          PHANTOMJS_CDNURL: "https://npmmirror.com/mirrors/phantomjs/"
          OPENSSL_CONF: "/dev/null"

        run: |
          ./mvnw -B clean verify



      # Package WAR
      - name: Package Production WAR
        env:
          KOTLIN_JVM_TARGET: "1.8"
          NODE_TLS_REJECT_UNAUTHORIZED: "0"
          PHANTOMJS_CDNURL: "https://npmmirror.com/mirrors/phantomjs/"
          OPENSSL_CONF: "/dev/null"

        run: |
          ./mvnw -B package -Pprod -DskipTests



      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: great-big-example-app-prod
          path: target/*.war




  # ============================
  # Job 2: SonarCloud Analysis
  # ============================
  sonar:

    name: SonarCloud Analysis
    runs-on: ubuntu-latest
    needs: build


    steps:

      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0



      # SonarCloud requires Java 21
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'



      - name: Make Maven Wrapper Executable
        run: chmod +x mvnw



      - name: Verify Java Version
        run: |
          java -version
          ./mvnw -version



      - name: Verify SONAR_TOKEN
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "SONAR_TOKEN is NOT set"
            exit 1
          else
            echo "SONAR_TOKEN is set"
          fi




      - name: SonarCloud Scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

        run: |
          ./mvnw -B sonar:sonar \
            -Dsonar.projectKey=0511145004-lukman_springboot-app-project \
            -Dsonar.organization=0511145004-lukman \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.token=${SONAR_TOKEN}
